version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: shiksha-setu-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: shiksha_setu
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: shiksha-setu-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/shiksha_setu
      - JWT_SECRET=super-secret-jwt-key-for-shiksha-setu-demo-min-32-chars
      - DOC_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb

volumes:
  mongo_data:
