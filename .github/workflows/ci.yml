name: Shiksha Setu CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint & Test (Client & Server)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Seed Verification Test
        run: npm run seed --workspace=server

      - name: Run Server Tests (Jest + Supertest)
        run: npm run test:server

      - name: Run Client Tests (Vitest + RTL)
        run: npm run test:client

      - name: Build Client Bundle (Vite + PWA)
        run: npm run build --workspace=client
